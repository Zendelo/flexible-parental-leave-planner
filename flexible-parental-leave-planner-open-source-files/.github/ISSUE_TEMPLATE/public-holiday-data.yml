name: Public holiday data issue
description: Report a missing, incorrect, local, substitute, or unconfirmed public holiday.
title: "[Holiday data] "
labels:
  - holiday-data
  - maintenance
body:
  - type: markdown
    attributes:
      value: |
        Public holiday data must be verified against an official state or territory government source.
        Do not include personal employment information.

  - type: dropdown
    id: jurisdiction
    attributes:
      label: Jurisdiction
      options:
        - ACT
        - NSW
        - NT
        - QLD
        - SA
        - TAS
        - VIC
        - WA
        - Other / local
    validations:
      required: true

  - type: input
    id: holiday
    attributes:
      label: Holiday name
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Holiday date
      description: Use YYYY-MM-DD if known. If the date is not yet confirmed, write "unconfirmed".
      placeholder: "YYYY-MM-DD or unconfirmed"
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Statewide / territory-wide
        - Regional
        - Local
        - Substitute / observed day
        - Unknown
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Official source URL
      placeholder: "https://..."
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What needs to change?
    validations:
      required: true
