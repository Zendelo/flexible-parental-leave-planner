name: Outdated legislation or Fair Work guidance
description: Report a legal rule or official guidance source that may have changed.
title: "[Legal update] "
labels:
  - legal-data
  - maintenance
body:
  - type: markdown
    attributes:
      value: |
        Use this template when the calculator may be relying on outdated legislation or Fair Work guidance.
        Please use **official primary sources**. Do not include personal employment details.

  - type: textarea
    id: rule
    attributes:
      label: Rule or guidance that may be outdated
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Official source URL
      description: Prefer legislation.gov.au or fairwork.gov.au.
      placeholder: "https://..."
    validations:
      required: true

  - type: input
    id: effective
    attributes:
      label: Effective date
      placeholder: "YYYY-MM-DD"
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Expected impact on the calculator
    validations:
      required: true
