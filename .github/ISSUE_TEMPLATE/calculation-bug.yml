name: Calculation bug
description: Report a result that appears mathematically or legally inconsistent.
title: "[Calculation] "
labels:
  - bug
  - calculation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a calculation issue.

        **Please do not include names, employer details, a child's name, or other identifying information.**
        Use generic/example dates where possible.

        This project is a guidance tool, not legal advice. For urgent or individual workplace advice, use an appropriate official or professional service.

  - type: textarea
    id: summary
    attributes:
      label: What appears to be wrong?
      description: Briefly describe the result you expected and what the calculator produced.
      placeholder: "Example: The staged plan ends after the 24-month deadline."
    validations:
      required: true

  - type: textarea
    id: inputs
    attributes:
      label: Reproduction inputs
      description: Provide only the minimum non-identifying inputs needed to reproduce the issue.
      placeholder: |
        Child DOB: YYYY-MM-DD
        Continuous leave start: YYYY-MM-DD
        Return date: YYYY-MM-DD
        Work pattern: 3 days/week
        Advanced options used: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Official source, if relevant
      description: If your report depends on a legal rule, please link to an official source such as legislation.gov.au or fairwork.gov.au.
      placeholder: "https://..."
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed names, employer details, and other unnecessary identifying information.
          required: true
